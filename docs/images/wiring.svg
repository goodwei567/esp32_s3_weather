<svg xmlns="http://www.w3.org/2000/svg" width="900" height="566" viewBox="0 0 900 566" font-family="Bahnschrift, Segoe UI, Microsoft YaHei UI, sans-serif">
  <defs>
    <pattern id="grid" width="18" height="18" patternUnits="userSpaceOnUse">
      <path d="M18 0H0V18" fill="none" stroke="#eef2f7" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="900" height="566" fill="#f8fafc"/>
  <rect width="900" height="566" fill="url(#grid)"/>

  <text x="40" y="42" font-size="23" font-weight="600" fill="#0f172a">ESP32-S3 室内气象站 · 接线图</text>
  <text x="40" y="64" font-size="13" fill="#64748b">屏幕走 SPI，传感器走 I2C，两组总线互相独立；全部使用 3.3V，必须共地</text>

  <!-- ============ 面板 1：屏幕 ============ -->
  <rect x="40" y="80" width="390" height="424" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="58" y="108" font-size="14" font-weight="600" fill="#0f172a">1.54" IPS 屏 · ST7789 · SPI</text>
  <text x="118" y="132" font-size="11" fill="#94a3b8" text-anchor="middle">模块引脚</text>
  <text x="340" y="132" font-size="11" fill="#94a3b8" text-anchor="middle">ESP32-S3</text>

  <g font-family="Cascadia Mono, Consolas, monospace" font-size="13">
    <!-- VCC -->
    <rect x="58" y="140" width="120" height="30" rx="8" fill="#fef2f2" stroke="#fecaca"/>
    <text x="118" y="160" text-anchor="middle" fill="#7f1d1d">VCC</text>
    <line x1="178" y1="155" x2="268" y2="155" stroke="#e5484d" stroke-width="3"/>
    <circle cx="178" cy="155" r="3" fill="#e5484d"/><circle cx="268" cy="155" r="3" fill="#e5484d"/>
    <rect x="268" y="140" width="144" height="30" rx="8" fill="#fef2f2" stroke="#fecaca"/>
    <text x="340" y="160" text-anchor="middle" fill="#7f1d1d">3V3</text>

    <!-- GND -->
    <rect x="58" y="186" width="120" height="30" rx="8" fill="#f4f4f5" stroke="#d4d4d8"/>
    <text x="118" y="206" text-anchor="middle" fill="#27272a">GND</text>
    <line x1="178" y1="201" x2="268" y2="201" stroke="#52525b" stroke-width="3"/>
    <circle cx="178" cy="201" r="3" fill="#52525b"/><circle cx="268" cy="201" r="3" fill="#52525b"/>
    <rect x="268" y="186" width="144" height="30" rx="8" fill="#f4f4f5" stroke="#d4d4d8"/>
    <text x="340" y="206" text-anchor="middle" fill="#27272a">GND</text>

    <!-- SCL -->
    <rect x="58" y="232" width="120" height="30" rx="8" fill="#fffbeb" stroke="#fde68a"/>
    <text x="118" y="252" text-anchor="middle" fill="#78350f">SCL</text>
    <line x1="178" y1="247" x2="268" y2="247" stroke="#f5a524" stroke-width="3"/>
    <circle cx="178" cy="247" r="3" fill="#f5a524"/><circle cx="268" cy="247" r="3" fill="#f5a524"/>
    <rect x="268" y="232" width="144" height="30" rx="8" fill="#fffbeb" stroke="#fde68a"/>
    <text x="340" y="252" text-anchor="middle" fill="#78350f">GPIO 4</text>

    <!-- SDA -->
    <rect x="58" y="278" width="120" height="30" rx="8" fill="#f0f9ff" stroke="#bae6fd"/>
    <text x="118" y="298" text-anchor="middle" fill="#0c4a6e">SDA</text>
    <line x1="178" y1="293" x2="268" y2="293" stroke="#0ea5e9" stroke-width="3"/>
    <circle cx="178" cy="293" r="3" fill="#0ea5e9"/><circle cx="268" cy="293" r="3" fill="#0ea5e9"/>
    <rect x="268" y="278" width="144" height="30" rx="8" fill="#f0f9ff" stroke="#bae6fd"/>
    <text x="340" y="298" text-anchor="middle" fill="#0c4a6e">GPIO 5</text>

    <!-- RES -->
    <rect x="58" y="324" width="120" height="30" rx="8" fill="#ecfdf5" stroke="#a7f3d0"/>
    <text x="118" y="344" text-anchor="middle" fill="#064e3b">RES</text>
    <line x1="178" y1="339" x2="268" y2="339" stroke="#10b981" stroke-width="3"/>
    <circle cx="178" cy="339" r="3" fill="#10b981"/><circle cx="268" cy="339" r="3" fill="#10b981"/>
    <rect x="268" y="324" width="144" height="30" rx="8" fill="#ecfdf5" stroke="#a7f3d0"/>
    <text x="340" y="344" text-anchor="middle" fill="#064e3b">GPIO 6</text>

    <!-- DC -->
    <rect x="58" y="370" width="120" height="30" rx="8" fill="#fdf2f8" stroke="#fbcfe8"/>
    <text x="118" y="390" text-anchor="middle" fill="#831843">DC</text>
    <line x1="178" y1="385" x2="268" y2="385" stroke="#ec4899" stroke-width="3"/>
    <circle cx="178" cy="385" r="3" fill="#ec4899"/><circle cx="268" cy="385" r="3" fill="#ec4899"/>
    <rect x="268" y="370" width="144" height="30" rx="8" fill="#fdf2f8" stroke="#fbcfe8"/>
    <text x="340" y="390" text-anchor="middle" fill="#831843">GPIO 7</text>

    <!-- CS -->
    <rect x="58" y="416" width="120" height="30" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="118" y="436" text-anchor="middle" fill="#334155">CS</text>
    <line x1="178" y1="431" x2="268" y2="431" stroke="#64748b" stroke-width="3"/>
    <circle cx="178" cy="431" r="3" fill="#64748b"/><circle cx="268" cy="431" r="3" fill="#64748b"/>
    <rect x="268" y="416" width="144" height="30" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="340" y="436" text-anchor="middle" fill="#334155">GPIO 15</text>

    <!-- BLK -->
    <rect x="58" y="462" width="120" height="30" rx="8" fill="#f7fee7" stroke="#d9f99d"/>
    <text x="118" y="482" text-anchor="middle" fill="#365314">BLK</text>
    <line x1="178" y1="477" x2="268" y2="477" stroke="#a3e635" stroke-width="3"/>
    <circle cx="178" cy="477" r="3" fill="#a3e635"/><circle cx="268" cy="477" r="3" fill="#a3e635"/>
    <rect x="268" y="462" width="144" height="30" rx="8" fill="#f7fee7" stroke="#d9f99d"/>
    <text x="340" y="482" text-anchor="middle" fill="#365314">GPIO 16</text>
  </g>

  <!-- ============ 面板 2：传感器 ============ -->
  <rect x="470" y="80" width="390" height="236" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="488" y="108" font-size="14" font-weight="600" fill="#0f172a">AHT20 + BMP280 · I2C</text>
  <text x="548" y="132" font-size="11" fill="#94a3b8" text-anchor="middle">模块引脚</text>
  <text x="770" y="132" font-size="11" fill="#94a3b8" text-anchor="middle">ESP32-S3</text>

  <g font-family="Cascadia Mono, Consolas, monospace" font-size="13">
    <!-- VDD -->
    <rect x="488" y="140" width="120" height="30" rx="8" fill="#fef2f2" stroke="#fecaca"/>
    <text x="548" y="160" text-anchor="middle" fill="#7f1d1d">VDD</text>
    <line x1="608" y1="155" x2="698" y2="155" stroke="#e5484d" stroke-width="3"/>
    <circle cx="608" cy="155" r="3" fill="#e5484d"/><circle cx="698" cy="155" r="3" fill="#e5484d"/>
    <rect x="698" y="140" width="144" height="30" rx="8" fill="#fef2f2" stroke="#fecaca"/>
    <text x="770" y="160" text-anchor="middle" fill="#7f1d1d">3V3</text>

    <!-- GND -->
    <rect x="488" y="186" width="120" height="30" rx="8" fill="#f4f4f5" stroke="#d4d4d8"/>
    <text x="548" y="206" text-anchor="middle" fill="#27272a">GND</text>
    <line x1="608" y1="201" x2="698" y2="201" stroke="#52525b" stroke-width="3"/>
    <circle cx="608" cy="201" r="3" fill="#52525b"/><circle cx="698" cy="201" r="3" fill="#52525b"/>
    <rect x="698" y="186" width="144" height="30" rx="8" fill="#f4f4f5" stroke="#d4d4d8"/>
    <text x="770" y="206" text-anchor="middle" fill="#27272a">GND</text>

    <!-- SCL -->
    <rect x="488" y="232" width="120" height="30" rx="8" fill="#fffbeb" stroke="#fde68a"/>
    <text x="548" y="252" text-anchor="middle" fill="#78350f">SCL</text>
    <line x1="608" y1="247" x2="698" y2="247" stroke="#f5a524" stroke-width="3"/>
    <circle cx="608" cy="247" r="3" fill="#f5a524"/><circle cx="698" cy="247" r="3" fill="#f5a524"/>
    <rect x="698" y="232" width="144" height="30" rx="8" fill="#fffbeb" stroke="#fde68a"/>
    <text x="770" y="252" text-anchor="middle" fill="#78350f">GPIO 10</text>

    <!-- SDA -->
    <rect x="488" y="278" width="120" height="30" rx="8" fill="#f0f9ff" stroke="#bae6fd"/>
    <text x="548" y="298" text-anchor="middle" fill="#0c4a6e">SDA</text>
    <line x1="608" y1="293" x2="698" y2="293" stroke="#0ea5e9" stroke-width="3"/>
    <circle cx="608" cy="293" r="3" fill="#0ea5e9"/><circle cx="698" cy="293" r="3" fill="#0ea5e9"/>
    <rect x="698" y="278" width="144" height="30" rx="8" fill="#f0f9ff" stroke="#bae6fd"/>
    <text x="770" y="298" text-anchor="middle" fill="#0c4a6e">GPIO 9</text>
  </g>

  <!-- 提示卡片 -->
  <rect x="470" y="332" width="390" height="172" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="488" y="360" font-size="13" font-weight="600" fill="#0f172a">接线要点</text>
  <g font-size="12.5" fill="#475569">
    <text x="488" y="386">1. 两组 SCL / SDA 协议不同（SPI 与 I2C），</text>
    <text x="502" y="404">绝不能插在同一组 GPIO 上</text>
    <text x="488" y="430">2. 两个模块各需一根 GND 接开发板 GND（共地）</text>
    <text x="488" y="454">3. 一律使用 3V3，不要接 5V</text>
    <text x="488" y="478">4. 建议不用面包板中转，减少虚接</text>
  </g>

  <text x="40" y="540" font-size="12" fill="#94a3b8">引脚可按需修改，改完同步更新 firmware/main.py 顶部的 PIN_* 常量即可</text>
  <text x="40" y="558" font-size="12" fill="#94a3b8">传感器丝印顺序为 VDD / SDA / GND / SCL，请按名字连接，不要按位置顺序照抄</text>
</svg>
